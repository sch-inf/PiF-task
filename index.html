<!DOCTYPE html>
<html lang="uk">
<head>
 <meta charset="utf-8" />
 <title>Робочий зошит — Підприємництво та фінансова грамотність</title>
 <meta name="viewport" content="width=device-width,initial-scale=1" />
 <style>
 :root{--bg:#e8f5f4;--accent:#52ab98;--muted:#2b6777;--card:#fff;}
 html,body{height:100%;margin:0;}
 body{font-family:"Inter",Arial,sans-serif;background-color:var(--bg);color:#222;line-height:1.5;padding:28px;box-sizing:border-box;}
 header,footer{text-align:center;}header{margin-bottom:26px;}header h1{margin:0;font-size:34px;color:var(--muted);}header p{margin:6px 0 0;color:var(--accent);font-size:18px;}
 .container{max-width:1250px;margin:0 auto;}footer{margin-top:40px;color:#4b6b63;font-size:14px;padding-bottom:20px;}
 
 /* НАВІГАЦІЯ ТА СІТКА */
 .tabs-nav{display:flex;justify-content:center;gap:12px;margin:24px 0;}
 .tab-btn{background:var(--card);color:var(--muted);border:2px solid transparent;padding:10px 24px;border-radius:20px;font-weight:700;font-size:16px;cursor:pointer;transition:all .2s;box-shadow:0 2px 6px rgba(0,0,0,0.04);}
 .tab-btn:hover{border-color:var(--accent);color:var(--accent);}
 .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
 .grid{display:none;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:22px;}
 .grid.active{display:grid;}
 
 /* КАРТКИ */
 .card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);display:flex;flex-direction:column;justify-content:space-between;min-height:160px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;}
 .card:hover{transform:translateY(-6px);box-shadow:0 8px 18px rgba(0,0,0,0.08);}
 .card-head{display:flex;align-items:center;gap:12px;}
 .num{width:44px;height:44px;flex-shrink:0;border-radius:10px;background:linear-gradient(180deg,var(--accent),#2f8f7a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;}
 .title{font-weight:700;color:var(--muted);font-size:16px;margin:0;}
 .subtitle-type{font-size:13px;color:#52ab98;font-weight:600;margin-top:4px;}
 .description{font-size:13px;color:#566;margin-top:12px;flex-grow:1;}
 .card-footer{margin-top:12px;display:flex;justify-content:space-between;align-items:center;}
 .link-btn{text-decoration:none;background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px;position:relative;z-index:2;}
 .meta{font-size:13px;color:#5a6b67;position:relative;z-index:2;}
 .card:hover .link-btn{background-color:var(--muted);color:#fff;}
 .card .link-btn::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;z-index:10;}
 </style>
</head>
<body>
 <div class="container">
 <header>
 <h1>Робочий зошит</h1>
 <p>Набір робочих аркушів для учнів з предмету <br>"Підприємництво та фінансова грамотність"</p>
 </header>

 <div class="tabs-nav">
 <button class="tab-btn active" onclick="switchClass('8', event)">8 Клас</button>
 <button class="tab-btn" onclick="switchClass('9', event)">9 Клас</button>
 </div>

 <main>
 <div class="grid active" id="sheets-grid-8"></div>
 <div class="grid" id="sheets-grid-9"></div>
 </main>

 <footer>
 <p>Завдання складені згідно програми Стеценко І. Б. та Андрусич О. О.</p>
 <p>Автор завдань: вчитель ЗЗСО Бахмутської міської ради Якубчак А.О.</p>
 </footer>
 </div>

 time: "20" 
 },
 {

 desc: "Узагальнюємо знання про доходи, витрати, кредити, депозити, інвестування та фінансову безпеку, аналізуючи відповідальні фінансові рішення й способи захисту від шахрайства.",

 ],
 "9": [
 /* СЮДИ СЛІД ВСТАВИТИ СПИСОК ДЛЯ 9 КЛАСУ АНАЛОГІЧНО ДО 8-ГО */

 title: "Тема-приклад для 9 класу",

 time: "20" 
 }
 ]
};

function renderGrid(cl) {
 const g = document.getElementById(`sheets-grid-${cl}`);g.innerHTML = "";
 courseData[cl].forEach((s, i) => {
 const card = document.createElement('div');card.className = 'card';
 card.innerHTML = `<div><div class="card-head"><div class="num">${i+1}</div><div><div class="title">Аркуш ${i+1} — ${s.title}</div><div class="subtitle-type">${s.type}</div></div></div><div class="description">${s.desc}</div></div><div class="card-footer"><span class="meta">≈ ${s.time} хв</span><a class="link-btn" href="class${cl}_sheet${i+1}.html">Відкрити</a></div>`;
 g.appendChild(card);
 });
}
function switchClass(cl, e) {
 document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));e.target.classList.add('active');
 document.querySelectorAll('.grid').forEach(g => g.classList.remove('active'));document.getElementById(`sheets-grid-${cl}`).classList.add('active');
}
renderGrid("8");renderGrid("9");
 </script>
</body>
</html>
